name: Bug
description: Algo no funciona como debería
title: "[bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1. 
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: "local / producción, navegador, versión, commit"
  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas
      description: Sin secretos, tokens ni datos personales.
      render: text
